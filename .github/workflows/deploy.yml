name: Publicar imagen en dockerhub

on:
  push:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar codigo 
        uses: actions/checkout@v3

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependecias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest


      - name: Ejecutar pruebas pytest
        run: pytest 
        
  build-and-push:
      needs: test
      runs-on: ubuntu-latest
      steps:

      - name: Iniciar sesion en DockerHub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: construir y empujar imagen de Docker
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: turus/app-689:latest

      - name: Desplegar en servidor cloud
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd ~/Docker-
            docker compose pull app_backend
            docker compose up -d 
