name: Publicar imagen en dockerhub

on:
  push:
    branches: ["main"]

jobs:
  test-and-security:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar codigo 
        uses: actions/checkout@v3

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest bandit

      - name: Escaneo de seguridad con Bandit
        run: bandit -r . -s B101 
      
      - name: Ejecutar pruebas con pytest
        run: pytest 
        
  build-and-push:
    needs: test-and-security
    runs-on: ubuntu-latest

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v3

      - name: Iniciar sesion en DockerHub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Construir imagen
        uses: docker/build-push-action@v4
        with:
          context: .
          push: false
          load: true
          no-cache: true
          tags: turus/app-689:latest
      
      - name: escanear contenedor con Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: turus/app-689:latest
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          scanners: 'vuln,secret'
          severity: 'CRITICAL'
      
      - name: Publicar imagen en DockerHub
        run: docker push turus/app-689:latest

      - name: Desplegar en servidor cloud
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd ~/Docker-
            docker compose pull app_backend
            docker compose up -d